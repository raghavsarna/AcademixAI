[project]
name = "academixai"
version = "0.2.0"
description = "Plain-language summaries of AI research: daily arXiv digests, PDF analysis and chat."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() in defaults is intended

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # PyMuPDF's compiled bindings trigger this on import
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
