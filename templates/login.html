<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademixAI - Login</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/static/js/safe.js"></script>
</head>
<body>
    <div class="background">
        <div class="gradient-bg"></div>
        <canvas id="particles-canvas"></canvas>
    </div>
    <header>
        <div class="left">
            <a href="/">
                <img src="/images/logo.png" alt="AcademixAI">
            </a>
        </div>
        <ul>
            <li><a href='/#features-section'>About</a></li>
            <li><a href='/home'>Home</a></li>
            <li><a href='#'>Contact Us</a></li>
        </ul>
        <div class="cta-buttons">
            <a href="/register"><button class="signup-btn">Sign Up</button></a>
        </div>
        <div class="menu-icon" aria-label="Open menu">
            <i class='bx bx-menu'></i>
        </div>
    </header>
    <div class="container">
        <div class="auth-container">
            <h1>Login to <span class="gradient">AcademixAI</span></h1>
            <div class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                </div>
                <div class="form-actions">
                    <button id="login-btn" class="primary-btn">Login</button>
                </div>
                <div class="auth-links">
                    <p>Don't have an account? <a href="/register">Sign up</a></p>
                </div>
                <div id="error-message" class="error-message"></div>
            </div>
        </div>
    </div>
    <footer>
        <h1>Copyright © AcademixAI, Made with ❤️ by Raghav Sarna</h1>
    </footer>
    <script>
        // Particles animation
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let mouseX = 0;
            let mouseY = 0;

            // Set canvas size
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            // Track mouse position
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            // Create particles
            function createParticles() {
                particles = [];
                const particleCount = Math.floor(window.innerWidth / 10); // Responsive particle count

                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 2 + 0.5,
                        color: `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.1})`,
                        speedX: Math.random() * 0.5 - 0.25,
                        speedY: Math.random() * 0.5 - 0.25
                    });
                }
            }

            // Draw particles
            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(particle => {
                    // Move particles
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;

                    // Wrap around edges
                    if (particle.x < 0) particle.x = canvas.width;
                    if (particle.x > canvas.width) particle.x = 0;
                    if (particle.y < 0) particle.y = canvas.height;
                    if (particle.y > canvas.height) particle.y = 0;

                    // Draw particle
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    ctx.fillStyle = particle.color;
                    ctx.fill();

                    // Connect particles near mouse
                    const dx = mouseX - particle.x;
                    const dy = mouseY - particle.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.2 * (1 - distance/150)})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particle.x, particle.y);
                        ctx.lineTo(mouseX, mouseY);
                        ctx.stroke();

                        // Slight attraction to mouse
                        particle.x += dx * 0.01;
                        particle.y += dy * 0.01;
                    }

                    // Connect nearby particles
                    particles.forEach(otherParticle => {
                        const dx = particle.x - otherParticle.x;
                        const dy = particle.y - otherParticle.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 100) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 * (1 - distance/100)})`;
                            ctx.lineWidth = 0.3;
                            ctx.moveTo(particle.x, particle.y);
                            ctx.lineTo(otherParticle.x, otherParticle.y);
                            ctx.stroke();
                        }
                    });
                });
            }

            // Animation loop
            function animate() {
                drawParticles();
                requestAnimationFrame(animate);
            }

            // Initialize
            window.addEventListener('resize', function() {
                resizeCanvas();
                createParticles();
            });

            resizeCanvas();
            createParticles();
            animate();
        });

        // Login functionality
        document.getElementById('login-btn').addEventListener('click', async function() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            if (!username || !password) {
                errorMessage.textContent = 'Please enter both username and password';
                return;
            }

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/api/auth/token', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token in localStorage
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('token_type', data.token_type);

                    // Redirect to homepage
                    window.location.href = '/home';
                } else {
                    errorMessage.textContent = apiErrorMessage(response.status, data, 'Login failed');
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = 'An error occurred during login';
            }
        });
    </script>
</body>
</html>
